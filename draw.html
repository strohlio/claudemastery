<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M.Strohl how to draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #9d4edd;
    --purple: #8a4fff;
    --blue: #2bb3ff;
    --green: #34d399;
    --yellow: #ffd23f;
    --orange: #ff8c42;
    --ink: #3a2a4d;
    --paper: #faf7ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Pacifico', cursive;
    background: linear-gradient(160deg, #efe6ff 0%, #e9e0ff 50%, #dff5ff 100%);
    color: var(--ink);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-weight: 800;
    font-size: clamp(28px, 7vw, 44px);
    text-align: center;
    line-height: 1;
    margin-bottom: 2px;
    background: linear-gradient(90deg, var(--violet), var(--purple), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 rgba(255,255,255,0.6));
  }
  .tagline {
    text-align: center;
    font-weight: 500;
    font-size: 14px;
    color: var(--purple);
    margin-bottom: 12px;
  }
  .tagline b { color: var(--violet); }

  /* MODE TOGGLE */
  .modes {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .mode {
    font-family: 'Pacifico', cursive;
    font-weight: 700;
    font-size: 16px;
    padding: 9px 18px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: white;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .mode:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .mode.active { background: var(--purple); color: white; }
  .hidden { display: none !important; }

  /* PICKER */
  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
    max-width: 560px;
  }
  .pick {
    font-family: 'Pacifico', cursive;
    font-weight: 600;
    font-size: 15px;
    padding: 8px 12px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: white;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .pick:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .pick.active { background: var(--yellow); }
  .pick .emoji { font-size: 20px; }

  /* STAGE */
  .stage {
    position: relative;
    width: min(92vw, 520px);
    height: min(92vw, 520px); /* explicit square — keeps the canvas from collapsing */
    aspect-ratio: 1 / 1;
    flex-shrink: 0;            /* don't let the flex layout squish it flat */
    background: white;
    border: 5px solid var(--ink);
    border-radius: 24px;
    box-shadow: 6px 6px 0 rgba(58,42,77,0.25);
    overflow: hidden;
    touch-action: none;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #guide { z-index: 1; }
  #art { z-index: 2; }

  .step-bubble {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: var(--purple);
    color: white;
    font-weight: 600;
    font-size: 15px;
    padding: 7px 16px;
    border-radius: 20px;
    box-shadow: 2px 2px 0 rgba(58,42,77,0.3);
    white-space: nowrap;
    max-width: 92%;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  .celebrate {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(255,255,255,0.85);
    text-align: center;
    pointer-events: none;
  }
  .celebrate.show { display: flex; animation: pop 0.4s ease; }
  .celebrate .big { font-size: 64px; }
  .celebrate .msg {
    font-family: 'Pacifico', cursive;
    font-weight: 800;
    font-size: 28px;
    color: var(--violet);
  }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }

  /* STEP CONTROLS */
  .steprow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  .stepbtn {
    font-family: 'Pacifico', cursive;
    font-weight: 700;
    font-size: 16px;
    padding: 10px 18px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: var(--green);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .stepbtn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .stepbtn.next { background: var(--violet); color: white; }
  .stepbtn:disabled { opacity: 0.4; cursor: default; }
  .stepcount { font-weight: 600; font-size: 15px; min-width: 70px; text-align: center; }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-top: 14px;
    max-width: 520px;
  }
  .swatch {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid white;
    cursor: pointer;
    box-shadow: 0 0 0 2px var(--ink);
  }
  .swatch.active { transform: scale(1.2); box-shadow: 0 0 0 3px var(--violet); }

  .tool {
    font-family: 'Pacifico', cursive;
    font-weight: 600;
    font-size: 14px;
    padding: 8px 12px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: white;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tool:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .tool.active { background: var(--blue); color: white; }

  .sizes { display: flex; gap: 6px; align-items: center; }
  .sizedot {
    background: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .sizedot.active { border-color: var(--violet); transform: scale(1.15); }

  .footer {
    margin-top: 16px;
    font-size: 13px;
    color: var(--purple);
    text-align: center;
    font-weight: 500;
    padding-bottom: 20px;
  }
  .footer b { color: var(--violet); }
</style>
</head>
<body>

<h1>M.Strohl how to draw</h1>
<p class="tagline" id="tagline">Pick something fun, then follow the <b>steps</b> to draw it! 🎨</p>

<div class="modes" id="modes">
  <button class="mode" id="modeFree">🎨 Free Draw</button>
  <button class="mode active" id="modeLearn">📚 Learn to Draw</button>
</div>

<div class="picker" id="picker"></div>

<div class="stage" id="stage">
  <canvas id="guide"></canvas>
  <canvas id="art"></canvas>
  <div class="step-bubble" id="bubble">Let's draw!</div>
  <div class="celebrate" id="celebrate">
    <div class="big">🎉🌟🎉</div>
    <div class="msg">You did it!</div>
  </div>
</div>

<div class="steprow">
  <button class="stepbtn" id="back">◀ Back</button>
  <div class="stepcount" id="count">Step 1</div>
  <button class="stepbtn next" id="next">Next ▶</button>
</div>

<button class="stepbtn" id="show" style="margin-top:8px;background:var(--yellow);">▶ Show Me How!</button>
<button class="stepbtn" id="toggleGuide" style="margin-top:8px;background:var(--blue);color:white;">🙈 Hide Help Lines</button>

<div class="toolbar" id="toolbar">
  <div class="sizes" id="sizes"></div>
  <button class="tool" id="penTool">✏️ Pen</button>
  <button class="tool" id="eraseTool">🧽 Eraser</button>
  <button class="tool" id="clearTool">🗑️ Clear</button>
  <button class="tool" id="saveTool">💾 Save</button>
</div>

<p class="footer">Made just for <b>Maya</b> the artist 💖 — drag your finger to draw!</p>

<script>
(function () {
  "use strict";

  // ---- Canvas setup ----
  var stage = document.getElementById('stage');
  var guide = document.getElementById('guide');
  var art = document.getElementById('art');
  var gctx = guide.getContext('2d');
  var actx = art.getContext('2d');
  var SIZE = 1000; // internal resolution
  [guide, art].forEach(function (c) { c.width = SIZE; c.height = SIZE; });

  // ---- Drawing state ----
  var color = '#9d4edd';
  var brush = 14;
  var erasing = false;
  var drawing = false;
  var lastX = 0, lastY = 0;

  // ---- Lesson definitions ----
  // Each shape builder returns a "stroke" the pen can trace:
  //   { pts: [ {x,y}, ... ] }  for lines, or  { dot: radius, pts: [{x,y}] } for filled dots.
  function arcStroke(x, y, r, a1, a2) {
    var p = [], n = Math.max(10, Math.round(Math.abs(a2 - a1) / (Math.PI / 24)));
    for (var i = 0; i <= n; i++) { var a = a1 + (a2 - a1) * i / n; p.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r }); }
    return { pts: p };
  }
  function circle(x, y, r) { return arcStroke(x, y, r, -Math.PI / 2, Math.PI * 1.5); }
  function arc(x, y, r, a1, a2) { return arcStroke(x, y, r, a1, a2); }
  function oval(x, y, rx, ry) {
    var p = []; for (var a = -Math.PI / 2; a <= Math.PI * 1.5 + 0.01; a += Math.PI / 24)
      p.push({ x: x + Math.cos(a) * rx, y: y + Math.sin(a) * ry }); return { pts: p };
  }
  function line(x1, y1, x2, y2) {
    var p = [], n = 12; for (var i = 0; i <= n; i++) p.push({ x: x1 + (x2 - x1) * i / n, y: y1 + (y2 - y1) * i / n });
    return { pts: p };
  }
  function poly(corners, close) {
    var p = [], pts = close ? corners.concat([corners[0]]) : corners;
    for (var s = 0; s < pts.length - 1; s++) {
      var a = pts[s], b = pts[s + 1], n = 10;
      for (var i = 0; i <= n; i++) p.push({ x: a[0] + (b[0] - a[0]) * i / n, y: a[1] + (b[1] - a[1]) * i / n });
    }
    return { pts: p };
  }
  function tri(x1, y1, x2, y2, x3, y3) { return poly([[x1, y1], [x2, y2], [x3, y3]], true); }
  function rect(x, y, w, h) { return poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true); }
  function dot(x, y, r) { return { dot: r, pts: [{ x: x, y: y }] }; }
  function rocketBody() {
    var p = [{ x: 420, y: 720 }, { x: 420, y: 380 }];
    for (var t = 0; t <= 1.001; t += 0.05) {
      p.push({
        x: (1 - t) * (1 - t) * 420 + 2 * (1 - t) * t * 500 + t * t * 580,
        y: (1 - t) * (1 - t) * 380 + 2 * (1 - t) * t * 180 + t * t * 380
      });
    }
    p.push({ x: 580, y: 720 }); p.push({ x: 420, y: 720 });
    return { pts: p };
  }
  function petals() {
    var out = [], n = 6; for (var i = 0; i < n; i++) { var a = (i / n) * Math.PI * 2;
      out.push(oval(500 + Math.cos(a) * 170, 400 + Math.sin(a) * 170, 80, 55)); } return out;
  }
  function rays() {
    var out = [], n = 12; for (var i = 0; i < n; i++) { var a = (i / n) * Math.PI * 2;
      out.push(line(500 + Math.cos(a) * 220, 500 + Math.sin(a) * 220, 500 + Math.cos(a) * 330, 500 + Math.sin(a) * 330)); }
    return out;
  }

  var lessons = {
    cat: { emoji: '🐱', label: 'Cat', steps: [
      { t: 'Draw a big circle for the head', s: [ circle(500, 480, 250) ] },
      { t: 'Add two triangle ears on top', s: [ tri(330, 320, 280, 130, 460, 250), tri(670, 320, 720, 130, 540, 250) ] },
      { t: 'Add two eyes and a nose', s: [ dot(420, 460, 26), dot(580, 460, 26), tri(470, 520, 530, 520, 500, 560) ] },
      { t: 'Draw whiskers and a smile!', s: [ line(560, 540, 740, 500), line(560, 560, 740, 580), line(440, 540, 260, 500), line(440, 560, 260, 580), arc(500, 540, 70, 0.15 * Math.PI, 0.85 * Math.PI) ] }
    ]},
    fish: { emoji: '🐠', label: 'Fish', steps: [
      { t: 'Draw an oval for the body', s: [ oval(460, 500, 260, 170) ] },
      { t: 'Add a triangle tail', s: [ tri(720, 500, 870, 380, 870, 620) ] },
      { t: 'Add an eye and a smile', s: [ circle(360, 460, 34), dot(360, 460, 14), arc(330, 540, 60, 0.05 * Math.PI, 0.55 * Math.PI) ] },
      { t: 'Draw a fin and some bubbles!', s: [ tri(470, 360, 560, 230, 600, 380), circle(250, 320, 22), circle(190, 250, 14), circle(150, 190, 9) ] }
    ]},
    flower: { emoji: '🌸', label: 'Flower', steps: [
      { t: 'Draw a circle in the middle', s: [ circle(500, 400, 90) ] },
      { t: 'Add petals all around it', s: petals() },
      { t: 'Draw a long stem', s: [ line(500, 490, 500, 850) ] },
      { t: 'Add two leaves on the stem!', s: [ oval(420, 660, 70, 35), oval(580, 740, 70, 35) ] }
    ]},
    house: { emoji: '🏠', label: 'House', steps: [
      { t: 'Draw a big square', s: [ rect(280, 450, 440, 380) ] },
      { t: 'Put a triangle roof on top', s: [ tri(250, 450, 750, 450, 500, 230) ] },
      { t: 'Add a door and two windows', s: [ rect(450, 650, 110, 180), rect(330, 530, 90, 90), rect(590, 530, 90, 90) ] },
      { t: 'Draw a sun and clouds!', s: [ circle(820, 200, 60), arc(150, 250, 50, Math.PI, Math.PI * 2), arc(220, 250, 60, Math.PI, Math.PI * 2), line(100, 250, 280, 250) ] }
    ]},
    rocket: { emoji: '🚀', label: 'Rocket', steps: [
      { t: 'Draw a tall rounded body', s: [ rocketBody() ] },
      { t: 'Add a round window', s: [ circle(500, 420, 60) ] },
      { t: 'Add fins on the sides', s: [ tri(420, 600, 320, 760, 420, 720), tri(580, 600, 680, 760, 580, 720) ] },
      { t: 'Draw fire and stars blasting off!', s: [ tri(440, 720, 560, 720, 500, 880), dot(250, 300, 10), dot(760, 250, 12), dot(720, 480, 8), dot(220, 520, 9) ] }
    ]},
    butterfly: { emoji: '🦋', label: 'Butterfly', steps: [
      { t: 'Draw a long thin body', s: [ oval(500, 500, 28, 200) ] },
      { t: 'Add two big top wings', s: [ oval(360, 380, 130, 110), oval(640, 380, 130, 110) ] },
      { t: 'Add two bottom wings', s: [ oval(380, 600, 110, 90), oval(620, 600, 110, 90) ] },
      { t: 'Add antennas and wing dots!', s: [ line(500, 320, 440, 220), line(500, 320, 560, 220), dot(360, 380, 22), dot(640, 380, 22), dot(380, 600, 18), dot(620, 600, 18) ] }
    ]},
    icecream: { emoji: '🍦', label: 'Ice Cream', steps: [
      { t: 'Draw a triangle cone', s: [ tri(380, 460, 620, 460, 500, 860) ] },
      { t: 'Add a scoop of ice cream', s: [ circle(500, 400, 130) ] },
      { t: 'Add another scoop on top', s: [ circle(500, 250, 110) ] },
      { t: 'Put a cherry and sprinkles on top!', s: [ circle(500, 110, 36), line(500, 90, 540, 40), dot(440, 380, 9), dot(560, 360, 9), dot(500, 300, 9), dot(470, 240, 9), dot(540, 250, 9) ] }
    ]},
    sun: { emoji: '☀️', label: 'Sun', steps: [
      { t: 'Draw a big circle', s: [ circle(500, 500, 200) ] },
      { t: 'Add sun rays all around', s: rays() },
      { t: 'Add two happy eyes', s: [ dot(430, 460, 26), dot(570, 460, 26) ] },
      { t: 'Draw a big smile!', s: [ arc(500, 520, 110, 0.1 * Math.PI, 0.9 * Math.PI) ] }
    ]}
  };

  // ---- Lesson + animation state ----
  var currentKey = 'cat';
  var stepIndex = 0;
  var animId = null;
  var STYLE_DONE = { color: '#e2d4f7', width: 6, dash: [14, 12] };
  var STYLE_CUR  = { color: '#8a4fff', width: 10, dash: [] };

  function curSteps() { return lessons[currentKey].steps; }
  function numSteps() { return curSteps().length; }
  function stepStrokes(i) { return curSteps()[i].s; }
  function stepText(i) { return curSteps()[i].t; }

  function strokeCount(strokes) {
    var n = 0; for (var k = 0; k < strokes.length; k++) { n += strokes[k].dot ? 1 : strokes[k].pts.length; }
    return n;
  }

  // Paint a step's strokes up to `budget` points. Returns the last point drawn (the pen tip).
  function paintStep(strokes, budget, style) {
    gctx.strokeStyle = style.color; gctx.fillStyle = style.color;
    gctx.lineWidth = style.width; gctx.lineCap = 'round'; gctx.lineJoin = 'round';
    var drawn = 0, tip = null;
    for (var k = 0; k < strokes.length; k++) {
      if (drawn >= budget) break;
      var s = strokes[k];
      if (s.dot) {
        gctx.setLineDash([]);
        gctx.beginPath(); gctx.arc(s.pts[0].x, s.pts[0].y, s.dot, 0, Math.PI * 2); gctx.fill();
        tip = s.pts[0]; drawn += 1; continue;
      }
      gctx.setLineDash(style.dash);
      var pts = s.pts, canDraw = Math.min(pts.length, budget - drawn);
      if (canDraw >= 2) {
        gctx.beginPath(); gctx.moveTo(pts[0].x, pts[0].y);
        for (var i = 1; i < canDraw; i++) gctx.lineTo(pts[i].x, pts[i].y);
        gctx.stroke(); tip = pts[canDraw - 1];
      } else if (canDraw === 1) { tip = pts[0]; }
      drawn += canDraw;
      if (canDraw < pts.length) break;
    }
    gctx.setLineDash([]);
    return tip;
  }

  function renderGuide(curBudget, showPen) {
    gctx.clearRect(0, 0, SIZE, SIZE);
    for (var i = 0; i < stepIndex; i++) paintStep(stepStrokes(i), Infinity, STYLE_DONE);
    var tip = paintStep(stepStrokes(stepIndex), curBudget, STYLE_CUR);
    if (showPen && tip) {
      gctx.beginPath(); gctx.fillStyle = '#9d4edd';
      gctx.arc(tip.x, tip.y, 18, 0, Math.PI * 2); gctx.fill();
      gctx.lineWidth = 6; gctx.strokeStyle = '#ffffff'; gctx.stroke();
    }
  }

  function updateUI() {
    document.getElementById('bubble').textContent = (stepIndex + 1) + '. ' + stepText(stepIndex);
    document.getElementById('count').textContent = 'Step ' + (stepIndex + 1) + ' / ' + numSteps();
    document.getElementById('back').disabled = (stepIndex === 0);
    document.getElementById('next').textContent = (stepIndex === numSteps() - 1) ? 'Done! 🎉' : 'Next ▶';
  }

  // Animate the current step like a little video — a pen traces each line.
  function animateStep() {
    if (animId) cancelAnimationFrame(animId);
    updateUI();
    setGuideHidden(false); // help lines visible so the pen animation can be seen
    var total = strokeCount(stepStrokes(stepIndex));
    var p = 0, speed = Math.max(3, Math.ceil(total / 55));
    function frame() {
      p += speed;
      renderGuide(p, true);
      if (p < total) { animId = requestAnimationFrame(frame); }
      else { animId = null; renderGuide(Infinity, false); }
    }
    frame();
  }

  // Draw the current step instantly (no animation).
  function drawGuide() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;
    updateUI();
    renderGuide(Infinity, false);
  }

  function celebrate() {
    var c = document.getElementById('celebrate');
    c.classList.add('show');
    setTimeout(function () { c.classList.remove('show'); }, 1800);
  }

  // When the tutorial is finished, remove the purple "how to" guide lines
  // so only Maya's own drawing is left on screen.
  function finishLesson() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;
    gctx.clearRect(0, 0, SIZE, SIZE);
    document.getElementById('bubble').textContent = '🌟 All done — this is YOUR drawing! 🌟';
    celebrate();
  }

  // ---- Build picker ----
  var picker = document.getElementById('picker');
  Object.keys(lessons).forEach(function (key) {
    var b = document.createElement('button');
    b.className = 'pick' + (key === currentKey ? ' active' : '');
    b.innerHTML = '<span class="emoji">' + lessons[key].emoji + '</span>' + lessons[key].label;
    b.addEventListener('click', function () {
      currentKey = key;
      stepIndex = 0;
      document.querySelectorAll('.pick').forEach(function (p) { p.classList.remove('active'); });
      b.classList.add('active');
      actx.clearRect(0, 0, SIZE, SIZE); // fresh canvas for new drawing
      animateStep();
    });
    picker.appendChild(b);
  });

  // ---- Step buttons ----
  document.getElementById('next').addEventListener('click', function () {
    if (stepIndex < numSteps() - 1) { stepIndex++; animateStep(); }
    else { finishLesson(); }
  });
  document.getElementById('back').addEventListener('click', function () {
    if (stepIndex > 0) { stepIndex--; animateStep(); }
  });
  document.getElementById('show').addEventListener('click', function () { animateStep(); });

  // ---- Hide / show the purple help lines so only the kid's drawing shows ----
  var guideHidden = false;
  var toggleBtn = document.getElementById('toggleGuide');
  function setGuideHidden(hidden) {
    guideHidden = hidden;
    guide.style.visibility = hidden ? 'hidden' : 'visible';
    toggleBtn.textContent = hidden ? '👀 Show Help Lines' : '🙈 Hide Help Lines';
  }
  toggleBtn.addEventListener('click', function () { setGuideHidden(!guideHidden); });

  // ---- Color palette ----
  var colors = ['#3a2a4d', '#9d4edd', '#8a4fff', '#2bb3ff', '#34d399',
                '#ffd23f', '#ff8c42', '#e8434b', '#7a5230', '#ffffff'];
  var toolbar = document.getElementById('toolbar');
  var palette = document.createElement('div');
  palette.style.display = 'flex';
  palette.style.flexWrap = 'wrap';
  palette.style.gap = '6px';
  palette.style.justifyContent = 'center';
  colors.forEach(function (col, i) {
    var s = document.createElement('div');
    s.className = 'swatch' + (col === color ? ' active' : '');
    s.style.background = col;
    s.addEventListener('click', function () {
      color = col; erasing = false;
      document.getElementById('penTool').classList.add('active');
      document.getElementById('eraseTool').classList.remove('active');
      document.querySelectorAll('.swatch').forEach(function (x) { x.classList.remove('active'); });
      s.classList.add('active');
    });
    palette.appendChild(s);
  });
  toolbar.insertBefore(palette, toolbar.firstChild);

  // ---- Brush sizes ----
  var sizes = document.getElementById('sizes');
  [8, 14, 24, 40].forEach(function (sz) {
    var d = document.createElement('div');
    d.className = 'sizedot' + (sz === brush ? ' active' : '');
    var visual = Math.max(10, sz * 0.6);
    d.style.width = visual + 'px';
    d.style.height = visual + 'px';
    d.addEventListener('click', function () {
      brush = sz;
      document.querySelectorAll('.sizedot').forEach(function (x) { x.classList.remove('active'); });
      d.classList.add('active');
    });
    sizes.appendChild(d);
  });

  // ---- Tools ----
  var penTool = document.getElementById('penTool');
  var eraseTool = document.getElementById('eraseTool');
  penTool.classList.add('active');
  penTool.addEventListener('click', function () {
    erasing = false;
    penTool.classList.add('active'); eraseTool.classList.remove('active');
  });
  eraseTool.addEventListener('click', function () {
    erasing = true;
    eraseTool.classList.add('active'); penTool.classList.remove('active');
  });
  document.getElementById('clearTool').addEventListener('click', function () {
    actx.clearRect(0, 0, SIZE, SIZE);
  });
  document.getElementById('saveTool').addEventListener('click', function () {
    // Combine white background + guide + art into one image to save
    var out = document.createElement('canvas');
    out.width = SIZE; out.height = SIZE;
    var octx = out.getContext('2d');
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, SIZE, SIZE);
    octx.drawImage(art, 0, 0);
    var link = document.createElement('a');
    link.download = 'maya-' + currentKey + '.png';
    link.href = out.toDataURL('image/png');
    link.click();
  });

  // ---- Drawing on the art canvas ----
  function pos(e) {
    var rect = art.getBoundingClientRect();
    var pt = e.touches ? e.touches[0] : e;
    return {
      x: (pt.clientX - rect.left) / rect.width * SIZE,
      y: (pt.clientY - rect.top) / rect.height * SIZE
    };
  }
  // Rub out a round spot on any canvas (used for the eraser).
  function eraseDot(ctx, x, y) {
    ctx.save();
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, brush / 2 + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // Rub out along a line on any canvas.
  function eraseLine(ctx, x1, y1, x2, y2) {
    ctx.save();
    ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = brush + 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    var p = pos(e);
    lastX = p.x; lastY = p.y;
    if (erasing) {
      // erase BOTH the drawing and the purple guide lines underneath
      eraseDot(actx, p.x, p.y);
      eraseDot(gctx, p.x, p.y);
    } else {
      actx.globalCompositeOperation = 'source-over';
      actx.beginPath();
      actx.fillStyle = color;
      actx.arc(p.x, p.y, brush / 2, 0, Math.PI * 2);
      actx.fill();
    }
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = pos(e);
    if (erasing) {
      eraseLine(actx, lastX, lastY, p.x, p.y);
      eraseLine(gctx, lastX, lastY, p.x, p.y); // rub away the AI guide lines too
    } else {
      actx.globalCompositeOperation = 'source-over';
      actx.strokeStyle = color;
      actx.lineWidth = brush;
      actx.lineCap = 'round';
      actx.lineJoin = 'round';
      actx.beginPath();
      actx.moveTo(lastX, lastY);
      actx.lineTo(p.x, p.y);
      actx.stroke();
    }
    lastX = p.x; lastY = p.y;
  }
  function end() { drawing = false; }

  art.addEventListener('mousedown', start);
  art.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  art.addEventListener('touchstart', start, { passive: false });
  art.addEventListener('touchmove', move, { passive: false });
  art.addEventListener('touchend', end);

  // ---- Mode switching: Free Draw vs Learn to Draw ----
  var modeFree = document.getElementById('modeFree');
  var modeLearn = document.getElementById('modeLearn');
  var steprow = document.querySelector('.steprow');
  var showBtn = document.getElementById('show');
  var tagline = document.getElementById('tagline');

  function setMode(free) {
    if (free) {
      if (animId) cancelAnimationFrame(animId);
      animId = null;
      modeFree.classList.add('active');
      modeLearn.classList.remove('active');
      picker.classList.add('hidden');
      steprow.classList.add('hidden');
      showBtn.classList.add('hidden');
      toggleBtn.classList.add('hidden');
      guide.style.visibility = 'visible'; // make sure guide isn't stuck hidden
      gctx.clearRect(0, 0, SIZE, SIZE); // blank guide — just draw!
      document.getElementById('bubble').textContent = 'Draw anything you want! ✨';
      tagline.innerHTML = 'A blank page just for you — <b>draw anything!</b> 🎨';
    } else {
      modeFree.classList.remove('active');
      modeLearn.classList.add('active');
      picker.classList.remove('hidden');
      steprow.classList.remove('hidden');
      showBtn.classList.remove('hidden');
      toggleBtn.classList.remove('hidden');
      tagline.innerHTML = 'Pick something fun, then follow the <b>steps</b> to draw it! 🎨';
      animateStep();
    }
  }
  modeFree.addEventListener('click', function () { setMode(true); });
  modeLearn.addEventListener('click', function () { setMode(false); });

  // ---- Go! ----
  animateStep();
})();
</script>
</body>
</html>
