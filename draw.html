<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maya's Draw-Along — Learn To Draw!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff5fa2;
    --purple: #8a4fff;
    --blue: #2bb3ff;
    --green: #34d399;
    --yellow: #ffd23f;
    --orange: #ff8c42;
    --ink: #3a2a4d;
    --paper: #fff7fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, #ffe6f3 0%, #e9e0ff 50%, #dff5ff 100%);
    color: var(--ink);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    user-select: none;
    -webkit-user-select: none;
  }

  h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(28px, 7vw, 44px);
    text-align: center;
    line-height: 1;
    margin-bottom: 2px;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 rgba(255,255,255,0.6));
  }
  .tagline {
    text-align: center;
    font-weight: 500;
    font-size: 14px;
    color: var(--purple);
    margin-bottom: 12px;
  }
  .tagline b { color: var(--pink); }

  /* MODE TOGGLE */
  .modes {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .mode {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 16px;
    padding: 9px 18px;
    border: 3px solid var(--ink);
    border-radius: 18px;
    background: white;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .mode:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .mode.active { background: var(--purple); color: white; }
  .hidden { display: none !important; }

  /* PICKER */
  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
    max-width: 560px;
  }
  .pick {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 8px 12px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: white;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .pick:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .pick.active { background: var(--yellow); }
  .pick .emoji { font-size: 20px; }

  /* STAGE */
  .stage {
    position: relative;
    width: min(92vw, 520px);
    aspect-ratio: 1 / 1;
    background: white;
    border: 5px solid var(--ink);
    border-radius: 24px;
    box-shadow: 6px 6px 0 rgba(58,42,77,0.25);
    overflow: hidden;
    touch-action: none;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #guide { z-index: 1; }
  #art { z-index: 2; }

  .step-bubble {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    background: var(--purple);
    color: white;
    font-weight: 600;
    font-size: 15px;
    padding: 7px 16px;
    border-radius: 20px;
    box-shadow: 2px 2px 0 rgba(58,42,77,0.3);
    white-space: nowrap;
    max-width: 92%;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  .celebrate {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(255,255,255,0.85);
    text-align: center;
    pointer-events: none;
  }
  .celebrate.show { display: flex; animation: pop 0.4s ease; }
  .celebrate .big { font-size: 64px; }
  .celebrate .msg {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 28px;
    color: var(--pink);
  }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }

  /* STEP CONTROLS */
  .steprow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  .stepbtn {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 16px;
    padding: 10px 18px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: var(--green);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .stepbtn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .stepbtn.next { background: var(--pink); color: white; }
  .stepbtn:disabled { opacity: 0.4; cursor: default; }
  .stepcount { font-weight: 600; font-size: 15px; min-width: 70px; text-align: center; }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-top: 14px;
    max-width: 520px;
  }
  .swatch {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid white;
    cursor: pointer;
    box-shadow: 0 0 0 2px var(--ink);
  }
  .swatch.active { transform: scale(1.2); box-shadow: 0 0 0 3px var(--pink); }

  .tool {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 8px 12px;
    border: 3px solid var(--ink);
    border-radius: 14px;
    background: white;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tool:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink); }
  .tool.active { background: var(--blue); color: white; }

  .sizes { display: flex; gap: 6px; align-items: center; }
  .sizedot {
    background: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .sizedot.active { border-color: var(--pink); transform: scale(1.15); }

  .footer {
    margin-top: 16px;
    font-size: 13px;
    color: var(--purple);
    text-align: center;
    font-weight: 500;
    padding-bottom: 20px;
  }
  .footer b { color: var(--pink); }
</style>
</head>
<body>

<h1>Maya's Draw-Along ✨</h1>
<p class="tagline" id="tagline">Pick something fun, then follow the <b>steps</b> to draw it! 🎨</p>

<div class="modes" id="modes">
  <button class="mode" id="modeFree">🎨 Free Draw</button>
  <button class="mode active" id="modeLearn">📚 Learn to Draw</button>
</div>

<div class="picker" id="picker"></div>

<div class="stage" id="stage">
  <canvas id="guide"></canvas>
  <canvas id="art"></canvas>
  <div class="step-bubble" id="bubble">Let's draw!</div>
  <div class="celebrate" id="celebrate">
    <div class="big">🎉🌟🎉</div>
    <div class="msg">You did it!</div>
  </div>
</div>

<div class="steprow">
  <button class="stepbtn" id="back">◀ Back</button>
  <div class="stepcount" id="count">Step 1</div>
  <button class="stepbtn next" id="next">Next ▶</button>
</div>

<div class="toolbar" id="toolbar">
  <div class="sizes" id="sizes"></div>
  <button class="tool" id="penTool">✏️ Pen</button>
  <button class="tool" id="eraseTool">🧽 Eraser</button>
  <button class="tool" id="clearTool">🗑️ Clear</button>
  <button class="tool" id="saveTool">💾 Save</button>
</div>

<p class="footer">Made just for <b>Maya</b> the artist 💖 — drag your finger to draw!</p>

<script>
(function () {
  "use strict";

  // ---- Canvas setup ----
  var stage = document.getElementById('stage');
  var guide = document.getElementById('guide');
  var art = document.getElementById('art');
  var gctx = guide.getContext('2d');
  var actx = art.getContext('2d');
  var SIZE = 1000; // internal resolution
  [guide, art].forEach(function (c) { c.width = SIZE; c.height = SIZE; });

  // ---- Drawing state ----
  var color = '#ff5fa2';
  var brush = 14;
  var erasing = false;
  var drawing = false;
  var lastX = 0, lastY = 0;

  // ---- Lesson definitions ----
  // Each lesson is a list of steps. Each step draws cumulative guide shapes.
  // Helper drawing primitives on the guide context:
  function circle(x, y, r) { gctx.beginPath(); gctx.arc(x, y, r, 0, Math.PI * 2); gctx.stroke(); }
  function oval(x, y, rx, ry) {
    gctx.beginPath(); gctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); gctx.stroke();
  }
  function line(x1, y1, x2, y2) { gctx.beginPath(); gctx.moveTo(x1, y1); gctx.lineTo(x2, y2); gctx.stroke(); }
  function arc(x, y, r, a1, a2) { gctx.beginPath(); gctx.arc(x, y, r, a1, a2); gctx.stroke(); }
  function tri(x1, y1, x2, y2, x3, y3) {
    gctx.beginPath(); gctx.moveTo(x1, y1); gctx.lineTo(x2, y2); gctx.lineTo(x3, y3); gctx.closePath(); gctx.stroke();
  }
  function dot(x, y, r) { gctx.beginPath(); gctx.arc(x, y, r, 0, Math.PI * 2); gctx.fillStyle = '#c9b6e0'; gctx.fill(); }

  var lessons = {
    cat: {
      emoji: '🐱', label: 'Cat',
      steps: [
        ['Draw a big circle for the head', function () { circle(500, 480, 250); }],
        ['Add two triangle ears on top', function () {
          tri(330, 320, 280, 130, 460, 250);
          tri(670, 320, 720, 130, 540, 250);
        }],
        ['Add two eyes and a nose', function () {
          dot(420, 460, 26); dot(580, 460, 26);
          tri(470, 520, 530, 520, 500, 560);
        }],
        ['Draw whiskers and a smile!', function () {
          line(560, 540, 740, 500); line(560, 560, 740, 580);
          line(440, 540, 260, 500); line(440, 560, 260, 580);
          arc(500, 540, 70, 0.15 * Math.PI, 0.85 * Math.PI);
        }]
      ]
    },
    fish: {
      emoji: '🐠', label: 'Fish',
      steps: [
        ['Draw an oval for the body', function () { oval(460, 500, 260, 170); }],
        ['Add a triangle tail', function () { tri(720, 500, 870, 380, 870, 620); }],
        ['Add an eye and a smile', function () {
          circle(360, 460, 34); dot(360, 460, 14);
          arc(330, 540, 60, 0.05 * Math.PI, 0.55 * Math.PI);
        }],
        ['Draw a fin and some bubbles!', function () {
          tri(470, 360, 560, 230, 600, 380);
          circle(250, 320, 22); circle(190, 250, 14); circle(150, 190, 9);
        }]
      ]
    },
    flower: {
      emoji: '🌸', label: 'Flower',
      steps: [
        ['Draw a circle in the middle', function () { circle(500, 400, 90); }],
        ['Add petals all around it', function () {
          var n = 6;
          for (var i = 0; i < n; i++) {
            var a = (i / n) * Math.PI * 2;
            oval(500 + Math.cos(a) * 170, 400 + Math.sin(a) * 170, 80, 55);
          }
        }],
        ['Draw a long stem', function () { line(500, 490, 500, 850); }],
        ['Add two leaves on the stem!', function () {
          oval(420, 660, 70, 35); oval(580, 740, 70, 35);
        }]
      ]
    },
    house: {
      emoji: '🏠', label: 'House',
      steps: [
        ['Draw a big square', function () {
          gctx.strokeRect(280, 450, 440, 380);
        }],
        ['Put a triangle roof on top', function () { tri(250, 450, 750, 450, 500, 230); }],
        ['Add a door and two windows', function () {
          gctx.strokeRect(450, 650, 110, 180);
          gctx.strokeRect(330, 530, 90, 90);
          gctx.strokeRect(590, 530, 90, 90);
        }],
        ['Draw a sun and clouds!', function () {
          circle(820, 200, 60);
          arc(150, 250, 50, Math.PI, 0); arc(220, 250, 60, Math.PI, 0); line(100, 250, 280, 250);
        }]
      ]
    },
    rocket: {
      emoji: '🚀', label: 'Rocket',
      steps: [
        ['Draw a tall rounded body', function () {
          gctx.beginPath();
          gctx.moveTo(420, 720); gctx.lineTo(420, 380);
          gctx.quadraticCurveTo(500, 180, 580, 380);
          gctx.lineTo(580, 720); gctx.closePath(); gctx.stroke();
        }],
        ['Add a round window', function () { circle(500, 420, 60); }],
        ['Add fins on the sides', function () {
          tri(420, 600, 320, 760, 420, 720);
          tri(580, 600, 680, 760, 580, 720);
        }],
        ['Draw fire and stars blasting off!', function () {
          tri(440, 720, 560, 720, 500, 880);
          dot(250, 300, 10); dot(760, 250, 12); dot(720, 480, 8); dot(220, 520, 9);
        }]
      ]
    },
    butterfly: {
      emoji: '🦋', label: 'Butterfly',
      steps: [
        ['Draw a long thin body', function () { oval(500, 500, 28, 200); }],
        ['Add two big top wings', function () {
          oval(360, 380, 130, 110); oval(640, 380, 130, 110);
        }],
        ['Add two bottom wings', function () {
          oval(380, 600, 110, 90); oval(620, 600, 110, 90);
        }],
        ['Add antennas and wing dots!', function () {
          line(500, 320, 440, 220); line(500, 320, 560, 220);
          dot(360, 380, 22); dot(640, 380, 22); dot(380, 600, 18); dot(620, 600, 18);
        }]
      ]
    },
    icecream: {
      emoji: '🍦', label: 'Ice Cream',
      steps: [
        ['Draw a triangle cone', function () { tri(380, 460, 620, 460, 500, 860); }],
        ['Add a scoop of ice cream', function () { circle(500, 400, 130); }],
        ['Add another scoop on top', function () { circle(500, 250, 110); }],
        ['Put a cherry and sprinkles on top!', function () {
          circle(500, 110, 36); line(500, 90, 540, 40);
          dot(440, 380, 9); dot(560, 360, 9); dot(500, 300, 9); dot(470, 240, 9); dot(540, 250, 9);
        }]
      ]
    },
    sun: {
      emoji: '☀️', label: 'Sun',
      steps: [
        ['Draw a big circle', function () { circle(500, 500, 200); }],
        ['Add sun rays all around', function () {
          var n = 12;
          for (var i = 0; i < n; i++) {
            var a = (i / n) * Math.PI * 2;
            line(500 + Math.cos(a) * 220, 500 + Math.sin(a) * 220,
                 500 + Math.cos(a) * 330, 500 + Math.sin(a) * 330);
          }
        }],
        ['Add two happy eyes', function () { dot(430, 460, 26); dot(570, 460, 26); }],
        ['Draw a big smile!', function () { arc(500, 520, 110, 0.1 * Math.PI, 0.9 * Math.PI); }]
      ]
    }
  };

  // ---- Lesson state ----
  var currentKey = 'cat';
  var stepIndex = 0;

  function drawGuide() {
    gctx.clearRect(0, 0, SIZE, SIZE);
    gctx.strokeStyle = '#d9c7ef';
    gctx.lineWidth = 6;
    gctx.lineCap = 'round';
    gctx.lineJoin = 'round';
    gctx.setLineDash([14, 12]);
    var steps = lessons[currentKey].steps;
    for (var i = 0; i <= stepIndex && i < steps.length; i++) {
      steps[i][1]();
    }
    gctx.setLineDash([]);
    updateUI();
  }

  function updateUI() {
    var steps = lessons[currentKey].steps;
    document.getElementById('bubble').textContent = (stepIndex + 1) + '. ' + steps[stepIndex][0];
    document.getElementById('count').textContent = 'Step ' + (stepIndex + 1) + ' / ' + steps.length;
    document.getElementById('back').disabled = (stepIndex === 0);
    var nextBtn = document.getElementById('next');
    nextBtn.textContent = (stepIndex === steps.length - 1) ? 'Done! 🎉' : 'Next ▶';
  }

  function celebrate() {
    var c = document.getElementById('celebrate');
    c.classList.add('show');
    setTimeout(function () { c.classList.remove('show'); }, 1800);
  }

  // ---- Build picker ----
  var picker = document.getElementById('picker');
  Object.keys(lessons).forEach(function (key) {
    var b = document.createElement('button');
    b.className = 'pick' + (key === currentKey ? ' active' : '');
    b.innerHTML = '<span class="emoji">' + lessons[key].emoji + '</span>' + lessons[key].label;
    b.addEventListener('click', function () {
      currentKey = key;
      stepIndex = 0;
      document.querySelectorAll('.pick').forEach(function (p) { p.classList.remove('active'); });
      b.classList.add('active');
      actx.clearRect(0, 0, SIZE, SIZE); // fresh canvas for new drawing
      drawGuide();
    });
    picker.appendChild(b);
  });

  // ---- Step buttons ----
  document.getElementById('next').addEventListener('click', function () {
    var steps = lessons[currentKey].steps;
    if (stepIndex < steps.length - 1) {
      stepIndex++;
      drawGuide();
    } else {
      celebrate();
    }
  });
  document.getElementById('back').addEventListener('click', function () {
    if (stepIndex > 0) { stepIndex--; drawGuide(); }
  });

  // ---- Color palette ----
  var colors = ['#3a2a4d', '#ff5fa2', '#8a4fff', '#2bb3ff', '#34d399',
                '#ffd23f', '#ff8c42', '#e8434b', '#7a5230', '#ffffff'];
  var toolbar = document.getElementById('toolbar');
  var palette = document.createElement('div');
  palette.style.display = 'flex';
  palette.style.flexWrap = 'wrap';
  palette.style.gap = '6px';
  palette.style.justifyContent = 'center';
  colors.forEach(function (col, i) {
    var s = document.createElement('div');
    s.className = 'swatch' + (col === color ? ' active' : '');
    s.style.background = col;
    s.addEventListener('click', function () {
      color = col; erasing = false;
      document.getElementById('penTool').classList.add('active');
      document.getElementById('eraseTool').classList.remove('active');
      document.querySelectorAll('.swatch').forEach(function (x) { x.classList.remove('active'); });
      s.classList.add('active');
    });
    palette.appendChild(s);
  });
  toolbar.insertBefore(palette, toolbar.firstChild);

  // ---- Brush sizes ----
  var sizes = document.getElementById('sizes');
  [8, 14, 24, 40].forEach(function (sz) {
    var d = document.createElement('div');
    d.className = 'sizedot' + (sz === brush ? ' active' : '');
    var visual = Math.max(10, sz * 0.6);
    d.style.width = visual + 'px';
    d.style.height = visual + 'px';
    d.addEventListener('click', function () {
      brush = sz;
      document.querySelectorAll('.sizedot').forEach(function (x) { x.classList.remove('active'); });
      d.classList.add('active');
    });
    sizes.appendChild(d);
  });

  // ---- Tools ----
  var penTool = document.getElementById('penTool');
  var eraseTool = document.getElementById('eraseTool');
  penTool.classList.add('active');
  penTool.addEventListener('click', function () {
    erasing = false;
    penTool.classList.add('active'); eraseTool.classList.remove('active');
  });
  eraseTool.addEventListener('click', function () {
    erasing = true;
    eraseTool.classList.add('active'); penTool.classList.remove('active');
  });
  document.getElementById('clearTool').addEventListener('click', function () {
    actx.clearRect(0, 0, SIZE, SIZE);
  });
  document.getElementById('saveTool').addEventListener('click', function () {
    // Combine white background + guide + art into one image to save
    var out = document.createElement('canvas');
    out.width = SIZE; out.height = SIZE;
    var octx = out.getContext('2d');
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, SIZE, SIZE);
    octx.drawImage(art, 0, 0);
    var link = document.createElement('a');
    link.download = 'maya-' + currentKey + '.png';
    link.href = out.toDataURL('image/png');
    link.click();
  });

  // ---- Drawing on the art canvas ----
  function pos(e) {
    var rect = art.getBoundingClientRect();
    var pt = e.touches ? e.touches[0] : e;
    return {
      x: (pt.clientX - rect.left) / rect.width * SIZE,
      y: (pt.clientY - rect.top) / rect.height * SIZE
    };
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    var p = pos(e);
    lastX = p.x; lastY = p.y;
    // a dot so single taps show
    actx.beginPath();
    actx.fillStyle = color;
    if (erasing) { actx.globalCompositeOperation = 'destination-out'; }
    else { actx.globalCompositeOperation = 'source-over'; }
    actx.arc(p.x, p.y, brush / 2, 0, Math.PI * 2);
    actx.fill();
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = pos(e);
    actx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    actx.strokeStyle = color;
    actx.lineWidth = brush;
    actx.lineCap = 'round';
    actx.lineJoin = 'round';
    actx.beginPath();
    actx.moveTo(lastX, lastY);
    actx.lineTo(p.x, p.y);
    actx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end() { drawing = false; }

  art.addEventListener('mousedown', start);
  art.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  art.addEventListener('touchstart', start, { passive: false });
  art.addEventListener('touchmove', move, { passive: false });
  art.addEventListener('touchend', end);

  // ---- Mode switching: Free Draw vs Learn to Draw ----
  var modeFree = document.getElementById('modeFree');
  var modeLearn = document.getElementById('modeLearn');
  var steprow = document.querySelector('.steprow');
  var tagline = document.getElementById('tagline');

  function setMode(free) {
    if (free) {
      modeFree.classList.add('active');
      modeLearn.classList.remove('active');
      picker.classList.add('hidden');
      steprow.classList.add('hidden');
      gctx.clearRect(0, 0, SIZE, SIZE); // blank guide — just draw!
      document.getElementById('bubble').textContent = 'Draw anything you want! ✨';
      tagline.innerHTML = 'A blank page just for you — <b>draw anything!</b> 🎨';
    } else {
      modeFree.classList.remove('active');
      modeLearn.classList.add('active');
      picker.classList.remove('hidden');
      steprow.classList.remove('hidden');
      tagline.innerHTML = 'Pick something fun, then follow the <b>steps</b> to draw it! 🎨';
      drawGuide();
    }
  }
  modeFree.addEventListener('click', function () { setMode(true); });
  modeLearn.addEventListener('click', function () { setMode(false); });

  // ---- Go! ----
  drawGuide();
})();
</script>
</body>
</html>
